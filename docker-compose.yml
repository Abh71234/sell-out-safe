services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./seed/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  authority:
    build: ./authority
    environment:
      PORT: "9000"
    ports:
      - "9001:9000"

  reservation-api:
    build: ./app
    depends_on:
      postgres:
        condition: service_healthy
      authority:
        condition: service_started
    environment:
      DATABASE_URL: "jdbc:postgresql://postgres:5432/student"
      DATABASE_USER: launchday
      DATABASE_PASSWORD: launchday
      AUTHORITY_URL: "http://authority:9000"
      PORT: "8080"
      STANDIN_MAX_PER_ITEM: "10"
      AUTHORITY_BREAKER_POLL_MS: "1000"
      AUTHORITY_BREAKER_HEALTHY_CHECKS: "3"
    ports:
      - "8080:8080"

  # One-shot Go test runner (the organiser-provided checks). Run via `make check`.
  checks:
    image: golang:1.22
    profiles: ["tools"]
    depends_on:
      - reservation-api
    working_dir: /w/checks
    volumes:
      - ./:/w
    environment:
      TRACK: backend
      API_URL: "http://reservation-api:8080"
      AUTHORITY_URL: "http://authority:9000"
    command: ["go", "run", "."]
